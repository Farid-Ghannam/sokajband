<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOKAJ — Credits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .credits-page{max-width:640px;margin:0 auto;padding:100px 24px 80px;}
  .credits-back{
    display:inline-flex;align-items:center;gap:10px;color:var(--bone);
    font-family:var(--f-body);font-size:1rem;font-weight:600;text-decoration:none;margin-bottom:32px;
    padding:12px 22px;border:1px solid rgba(242,237,226,.2);border-radius:2px;
    transition:color .2s ease,border-color .2s ease,background .2s ease;
  }
  .credits-back:hover{color:var(--red);border-color:var(--red);background:rgba(232,22,31,.08);}
  .credits-title{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);color:var(--bone);margin-bottom:36px;text-align:center;}
  .credits-photo{
    display:block;margin:0 auto 18px;
    width:120px;height:120px;border-radius:50%;overflow:hidden;
    border:2px solid rgba(232,22,31,.4);
  }
  .credits-photo img{width:100%;height:100%;object-fit:cover;}
  .credits-ig{
    display:block;text-align:center;
    font-family:var(--f-display);color:var(--bone);font-size:1.4rem;letter-spacing:.02em;
    text-decoration:none;margin-bottom:16px;
    transition:color .2s ease;
  }
  .credits-ig:hover{color:var(--red);}
  .credits-msg{
    text-align:center;color:var(--ash);font-family:var(--f-body);font-size:.95rem;
    line-height:1.6;max-width:440px;margin:0 auto;
  }
  .credits-note{color:var(--ash);font-family:var(--f-body);font-size:.85rem;margin-top:50px;text-align:center;}
</style>
</head>
<body>

<div style="position:fixed;inset:0;background:var(--black);z-index:-1;"></div>

<main class="credits-page">
  <a href="index.html" class="credits-back">← Back to Site</a>
  <h1 class="credits-title">Credits</h1>

  <a href="https://www.instagram.com/saayuiii/" target="_blank" rel="noopener" class="credits-photo"><img src="assets/members/creator.jpg" alt="Saayuiii"></a>
  <a href="https://www.instagram.com/saayuiii/" target="_blank" rel="noopener" class="credits-ig">@saayuiii</a>
  <p class="credits-msg">This site was made with love for Sokaj. Edit this message anytime.</p>

</main>

</body>
</html>
