<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOKAJ — September 3, 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .concert-page{max-width:1100px;margin:0 auto;padding:100px 24px 80px;}
  .concert-back{
    display:inline-flex;align-items:center;gap:8px;color:var(--ash);
    font-family:var(--f-body);font-size:.85rem;text-decoration:none;margin-bottom:28px;
    transition:color .2s ease;
  }
  .concert-back:hover{color:var(--red);}
  .concert-title{font-family:var(--f-display);font-size:clamp(2rem,6vw,3.2rem);color:var(--bone);margin-bottom:8px;}
  .concert-date{font-family:var(--f-body);color:var(--red);font-size:.95rem;font-weight:600;letter-spacing:.03em;margin-bottom:36px;}
  .concert-photo-grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  }
  @media(max-width:640px){.concert-photo-grid{grid-template-columns:repeat(2,1fr);}}
  .concert-photo-placeholder{
    aspect-ratio:1/1;background:rgba(255,255,255,.03);border:1px dashed rgba(242,237,226,.15);
    display:flex;align-items:center;justify-content:center;color:var(--ash);
    font-family:var(--f-body);font-size:.75rem;text-align:center;padding:10px;
  }
  .concert-empty-note{color:var(--ash);font-family:var(--f-body);font-size:.9rem;margin-top:20px;}
</style>
</head>
